# amtrak-sniper config — copy to config.yaml and edit (or use the web UI Setup page)
route: { from_code: WAS, to_code: BOS }   # Amtrak station codes
dates: ["2026-11-20", "2026-11-21"]       # any train on these dates qualifies
max_price_usd: 59.99                      # your bid: alert/buy at or below this
seat_class: coach
min_seats_available: 1
poll_median_seconds: 180
jitter_fraction: 0.3
daily_request_cap: 400
notify:
  channel: telegram
  # OPTIONAL — alerts always appear in the web UI. Telegram adds phone push.
  # You can use a bot someone else owns: press Start on THEIR bot, put YOUR
  # chat id here, and have them share the token with you PRIVATELY (never via
  # git — whoever holds a bot token controls that bot).
  bot_token: ""   # from @BotFather (/newbot), or a shared bot's token
  chat_id: ""     # your numeric chat id — press Start on the bot first, then
                  # read chat.id from https://api.telegram.org/bot<TOKEN>/getUpdates
auto_checkout: false   # keep false; enable only after weeks of clean monitoring
proxy: ""              # optional: http://user:pass@host:port
